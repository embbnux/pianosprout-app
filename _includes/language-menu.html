<details class="lang">
  <summary aria-label="{{ t.nav.language }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>{{ L.name }}</span></summary>
  <ul class="card">
    {%- for l in site.data.languages %}
    <li><a href="{% if page.kind == 'privacy' %}{{ l.privacy }}{% else %}{{ l.home }}{% endif %}" hreflang="{{ l.code }}" lang="{{ l.code }}"{% if l.code == lang %} aria-current="page"{% endif %}>{{ l.name }}</a></li>
    {%- endfor %}
  </ul>
</details>
