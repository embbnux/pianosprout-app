faq:
  title: 常见问题
  items:
    - q: 家长管理打开了，怎么关？
      a: "点 ⚙，答对算术题，在「家长」里关掉「家长管理」。"
    - q: 怎么重新选「谁来弹琴」？
      a: "设置 › 家长 ›「谁来弹琴」。"
    - q: 怎么换曲子？
      a: "点键盘上方的曲名，选一首。弹完一首也可以直接点「下一首」。"
    - q: 按了键，曲谱不往下走？
      a: "「弹奏判定」选的是「弹对才前进」时，只有按亮起的键才往下走。想按哪个键都往下走，在设置 › 弹奏里改成「自由跟弹」。"
    - q: 怎么导入自己的曲子？
      a: "点曲名，选列表最后的「导入 MIDI」，从「文件」里选一个 .mid 文件，选一条音轨，点「保存」。"
    - q: 换了手机，导入的曲子还在吗？
      a: "用 iCloud 备份恢复新手机时还在。删掉 App 再装就没有了；iPhone 和 iPad 之间不同步。"
    - q: 没有声音？
      a: "先看音量。手机打开静音模式时也会出声，也可以用蓝牙耳机。"
    - q: 支持哪些设备？
      a: "iPhone 和 iPad，需要 iOS 15.6 或更新的系统。iPhone 上横屏弹，iPad 横屏、竖屏都可以。"
    - q: 要花钱吗？
      a: "不要。免费下载，没有内购，也没有广告。"
