faq:
  title: 常見問題
  items:
    - q: 家長管理開啟了，怎麼關？
      a: "點 ⚙，答對算術題，在「家長」裡關掉「家長管理」。"
    - q: 怎麼重新選「誰來彈琴」？
      a: "設置 › 家長 ›「誰來彈琴」。"
    - q: 怎麼換曲子？
      a: "點鍵盤上方的曲名，選一首。彈完一首也可以直接點「下一首」。"
    - q: 按了鍵，曲譜不往下走？
      a: "「彈奏判定」選的是「彈對才前進」時，只有按亮起的鍵才往下走。想按哪個鍵都往下走，在設置 › 彈奏裡改成「自由跟彈」。"
    - q: 怎麼匯入自己的曲子？
      a: "點曲名，選列表最後的「匯入 MIDI」，從「檔案」裡選一個 .mid 檔，選一條音軌，點「儲存」。"
    - q: 換了手機，匯入的曲子還在嗎？
      a: "用 iCloud 備份回復新手機時還在。刪掉 App 再裝就沒有了；iPhone 和 iPad 之間不同步。"
    - q: 沒有聲音？
      a: "先看音量。手機開啟靜音模式時也會出聲，也可以用藍牙耳機。"
    - q: 支援哪些裝置？
      a: "iPhone 和 iPad，需要 iOS 15.6 或更新的系統。iPhone 上橫向彈，iPad 橫向、直向都可以。"
    - q: 要花錢嗎？
      a: "不用。免費下載，沒有 App 內購買，也沒有廣告。"
