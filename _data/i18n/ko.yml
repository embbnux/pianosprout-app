faq:
  title: 자주 묻는 질문
  items:
    - q: 자녀 보호를 끄려면?
      a: "⚙을 누르고 계산 문제를 푼 다음, '보호자'에서 자녀 보호를 끄세요."
    - q: "'누가 연주하나요'를 다시 고르려면?"
      a: "설정 › 보호자 › 누가 연주하나요."
    - q: 곡을 바꾸려면?
      a: "건반 위 곡 이름을 눌러 고르세요. 한 곡을 마친 뒤 '다음 곡'을 눌러도 돼요."
    - q: 건반을 눌러도 악보가 넘어가지 않아요.
      a: "연주 판정이 '맞는 건반만'이면 빛나는 건반을 눌러야 넘어가요. 아무 건반으로나 넘어가게 하려면 설정 › 연주에서 '아무 건반이나 진행'을 고르세요."
    - q: 내 곡을 넣으려면?
      a: "곡 이름을 누르고 목록 맨 끝의 'MIDI 가져오기'에서 '파일'의 .mid 파일을 고른 뒤, 트랙을 고르고 '저장'을 누르세요."
    - q: 휴대폰을 바꾸면 가져온 곡도 옮겨지나요?
      a: "iCloud 백업으로 새 iPhone을 복원하면 남아 있어요. 앱을 지우고 다시 설치하면 사라지고, iPhone과 iPad 사이에는 동기화되지 않아요."
    - q: 소리가 안 나요.
      a: "음량을 확인하세요. 무음 모드에서도 소리가 나고, 블루투스 헤드폰도 쓸 수 있어요."
    - q: 어떤 기기에서 쓸 수 있나요?
      a: "iOS 15.6 이상의 iPhone과 iPad. iPhone에서는 가로로, iPad에서는 가로·세로 모두 연주할 수 있어요."
    - q: 비용이 드나요?
      a: "아니요. 무료이고, 앱 내 구입도 광고도 없어요."
