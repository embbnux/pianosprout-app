ipad:
  eyebrow: iPad
  title: Mais partitura no iPad
  text: "Numa janela grande, a partitura vira uma estante com várias linhas que acompanha você. Vertical, horizontal e janelas menores têm cada uma o seu layout, com teclas maiores."
more:
  - title: Mais de 70 instrumentos
    text: "Piano de cauda, violão, violino, flauta, kalimba, steel drums, xilofone e mais. Troque com um toque."
  - title: Tocar livre
    text: "O teclado multitoque é todo seu. O que você toca é escrito na pauta acima das teclas."
  - title: Importar MIDI
    text: "Importe um arquivo MIDI, escolha uma faixa, e ela vira uma música para tocar junto como as incluídas."
safe:
  eyebrow: Para os pais
  title: Seguro para crianças
  text: "Com o Controle dos Pais ativado, as configurações e a importação só abrem depois que um adulto resolve uma continha."
  items: [Sem anúncios, Sem conta, Nenhum dado coletado, Funciona offline]
  privacy: Ler a política de privacidade
faq:
  title: Perguntas frequentes
  items:
    - q: "O Controle dos Pais está ativado. Como desativo?"
      a: "Toque em ⚙, resolva a continha e desative o Controle dos Pais em \"Pais\"."
    - q: "Como escolho \"Quem vai tocar?\" de novo?"
      a: "Configurações › Pais › Quem vai tocar."
    - q: Como troco de música?
      a: "Toque no nome da música acima das teclas e escolha outra. No fim de uma música, você também pode tocar em \"Próxima\"."
    - q: "Toco uma tecla, mas a partitura não avança."
      a: "Se a verificação ao tocar estiver em \"Só teclas corretas\", só a tecla acesa faz avançar. Escolha \"Qualquer tecla avança\" em Configurações › Tocar para que qualquer tecla conte."
    - q: Como adiciono minhas próprias músicas?
      a: "Toque no nome da música e em \"Importar MIDI\", no fim da lista. Escolha um arquivo .mid no app Arquivos, uma faixa e toque em \"Salvar\"."
    - q: "Minhas músicas importadas vão para um iPhone novo?"
      a: "Sim, se você configurar o aparelho novo a partir de um backup do iCloud. Apagar e reinstalar o app remove as músicas, e elas não sincronizam entre iPhone e iPad."
    - q: Não sai som.
      a: "Confira o volume. O PianoSprout toca mesmo no modo silencioso e funciona com fones Bluetooth."
    - q: Em quais aparelhos funciona?
      a: "iPhone e iPad com iOS 15.6 ou posterior. No iPhone, toca-se na horizontal; no iPad, na horizontal ou na vertical."
    - q: É pago?
      a: "Não. É grátis, sem compras dentro do app e sem anúncios."
