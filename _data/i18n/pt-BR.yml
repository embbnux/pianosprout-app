hero:
  eyebrow: Um piano para crianças e iniciantes
  title: "Toque na tecla que acende e uma música conhecida ganha vida"
  lead: "O PianoSprout transforma seu iPhone ou iPad em um piano que qualquer um consegue tocar. Toque na tecla que acende e o app faz cada nota soar exatamente pelo tempo certo. Os pequenos, as crianças que começam a ler música e os adultos que só querem relaxar têm, cada um, o seu jeito de tocar."
