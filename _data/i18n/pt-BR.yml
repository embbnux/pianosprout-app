steps:
  title: Três passos para a primeira música
  items:
    - title: Escolha uma música
      text: "30 músicas incluídas, as mais fáceis primeiro, começando por Brilha, Brilha Estrelinha."
    - title: Toque na tecla que acende
      text: "A próxima tecla acende em roxo, com o nome escrito nela. Uma nota repetida mostra quantas vezes apertar."
    - title: Toque até o fim
      text: "Com a duração automática, cada nota soa pelo tempo indicado. Cada música terminada acaba com uma pequena comemoração."
notation:
  eyebrow: Linha da partitura
  title: "Pauta, números ou letras: leia música do seu jeito"
  text: "A partitura avança acima das teclas enquanto você toca. A próxima nota é roxa, como a tecla a apertar. Ainda não lê pauta? Mude para números ou letras."
  chips: [Pauta, "Números 1 2 3", "Letras C D E"]
songs:
  eyebrow: 30 músicas
  title: "As mais fáceis primeiro, de Brilha, Brilha Estrelinha à Sonata ao Luar"
  text: "Cantigas, músicas folclóricas e clássicos, cada um com o nome que você conhece. Toque no nome da música acima das teclas para trocar e, no fim, siga direto para a próxima."
  list: ["Brilha, Brilha Estrelinha", "Maria Tinha um Carneirinho", "Flor de Jasmim", "Hino à Alegria", "Para Elisa", "Sonata ao Luar"]
rainbow:
  eyebrow: Notas arco-íris
  title: "Ainda não sabe ler? Encontre a tecla pela cor."
  text: "Cada nome de nota tem a sua cor, a mesma nas teclas e na partitura. Para os pequenos que ainda não leem. Ative em Configurações › Exibição."
