meta:
  title: "PianoSprout – Appuyez sur la touche qui s'allume. Jouez un air que vous connaissez."
  description: "Une app de piano pour les enfants et les débutants. Appuyez sur la touche qui s'allume et chaque note dure ce qu'indique la partition. Partition au-dessus des touches, 30 morceaux, notes arc-en-ciel et contrôle parental. Gratuite, sans publicité."
