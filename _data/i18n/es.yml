# Español. Basado en el texto de la App Store de la 2.2 (BabyPiano docs/app-store/es.md); ajustes y canciones como en la app.
meta:
  title: "PianoSprout – Toca la tecla que se ilumina y suena una canción que conoces"
  description: "Una app de piano para niños y principiantes. Toca la tecla que se ilumina y cada nota suena el tiempo que marca la partitura. Partitura sobre las teclas, 30 canciones, notas arcoíris y control parental. Gratis y sin anuncios."
  privacy_title: "Política de privacidad – PianoSprout"
