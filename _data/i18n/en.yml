  privacy: Read the privacy policy
faq:
  title: Questions and answers
  items:
    - q: "Parental control is on. How do I turn it off?"
      a: "Tap ⚙, solve the sum, and turn off Parental control under Parents."
    - q: "How do I pick “Who's playing?” again?"
      a: "Settings › Parents › Who's playing."
    - q: How do I change songs?
      a: "Tap the song name above the keys and pick one. When a song ends, you can also tap “Next”."
    - q: "I tap a key but the score doesn't move on."
      a: "With Play check set to “Only correct keys”, only the glowing key moves on. Choose “Any key moves on” under Settings › Play to let every key count."
    - q: How do I add my own songs?
      a: "Tap the song name, then Import MIDI at the end of the list. Choose a .mid file in Files, pick a track and tap Save."
    - q: "Do my imported songs come with me to a new phone?"
      a: "Yes, if you set up the new phone from an iCloud backup. Deleting and reinstalling the app removes them, and they don't sync between iPhone and iPad."
    - q: "I can't hear anything."
      a: "Check the volume. PianoSprout plays even when the Ring/Silent switch is set to silent, and works with Bluetooth headphones."
    - q: Which devices does it run on?
      a: "iPhone and iPad with iOS 15.6 or later. It plays in landscape on iPhone, and in landscape or portrait on iPad."
    - q: Does it cost anything?
      a: "No. It's free, with no in-app purchases and no ads."
