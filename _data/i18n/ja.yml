faq:
  title: よくある質問
  items:
    - q: ペアレンタルコントロールをオフにするには？
      a: "⚙ をタップして計算問題に答え、「保護者」でペアレンタルコントロールをオフにします。"
    - q: 「だれが弾く？」を選び直すには？
      a: "設定 › 保護者 › だれが弾く。"
    - q: 曲を変えるには？
      a: "鍵盤の上の曲名をタップして選びます。1曲弾き終えたら「次の曲」をタップしても変えられます。"
    - q: キーを押しても楽譜が進みません。
      a: "演奏チェックが「正しいキーだけ」のときは、光っているキーでないと進みません。どのキーでも進めたいときは、設定 › 演奏 で「どのキーでも進む」を選んでください。"
    - q: 自分の曲を入れるには？
      a: "曲名をタップし、リストの最後の「MIDIをインポート」から、「ファイル」の .mid ファイルを選び、トラックを選んで「保存」をタップします。"
    - q: 機種変更しても、インポートした曲は残りますか？
      a: "iCloudバックアップから新しいiPhoneを復元すれば残ります。アプリを削除して入れ直すと消え、iPhoneとiPadの間では同期されません。"
    - q: 音が出ません。
      a: "音量を確認してください。消音モード（サイレントモード）でも音が鳴ります。Bluetoothのヘッドホンも使えます。"
    - q: 対応機種は？
      a: "iOS 15.6以降のiPhoneとiPad。iPhoneでは横向き、iPadでは横向き・縦向きのどちらでも弾けます。"
    - q: 料金はかかりますか？
      a: "かかりません。無料で、App内課金も広告もありません。"
