# One row per language. Order is the order of the language menus.
#   code     lang attribute, hreflang and the file name in _data/i18n
#   name     the language's own name, as shown in the menus
#   home     address of the home page
#   privacy  address of the privacy policy (the old addresses stay: App Store Connect links to them)
#   app      the app's name under its icon in that language
#   sub      shown small after the name when the name is not PianoSprout
#   badge    file in assets/badges (Apple's localized App Store badge)
#   og       Open Graph locale
- code: en
  name: English
  home: /
  privacy: /privacy.en
  app: PianoSprout
  badge: en-us
  og: en_US
- code: zh-Hans
  name: 简体中文
  home: /zh-hans/
  privacy: /privacy.zh-Hans
  app: 宝宝钢琴师
  sub: PianoSprout
  badge: zh-cn
  og: zh_CN
